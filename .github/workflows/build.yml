name: 'build'

on:
  push:
    paths-ignore:
      - README.adoc
      - .gitignore
      - .editorconfig
      - LICENSE.txt
      - LICENSE
    branches:
      - main
  pull_request:
    paths-ignore:
      - README.adoc
      - .gitignore
      - .editorconfig
      - LICENSE.txt
      - LICENSE

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check
        run: ./gradlew check spotlessCheck
