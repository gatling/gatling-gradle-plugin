name: 'build'

on:
  push:
    paths-ignore:
      - README.adoc
      - .gitignore
      - .editorconfig
      - LICENSE.txt
      - LICENSE
    branches:
      - main
  pull_request:
    paths-ignore:
      - README.adoc
      - .gitignore
      - .editorconfig
      - LICENSE.txt
      - LICENSE

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.GATLING_BOT_GITHUB_CI }}
          aws-region: us-east-1

      - name: Set up Gatling staging repository
        env:
          AWS_CODEARTIFACT_DOMAIN: ${{ vars.AWS_CODEARTIFACT_DOMAIN }}
          AWS_CODEARTIFACT_OWNER: ${{ vars.AWS_CODEARTIFACT_OWNER }}
          STAGING_REPOSITORY: ${{ vars.MAVEN_STAGING_REPOSITORY }}
        run: |
          token="$(aws codeartifact get-authorization-token --domain "$AWS_CODEARTIFACT_DOMAIN" --domain-owner "$AWS_CODEARTIFACT_OWNER" --query authorizationToken --output text)"
          echo "::add-mask::$token"
          # Gradle properties read by build.gradle and by the builds generated in functional tests
          {
            echo "ORG_GRADLE_PROJECT_gatlingStagingUrl=${STAGING_REPOSITORY#*::}"
            echo "ORG_GRADLE_PROJECT_gatlingStagingUsername=aws"
            echo "ORG_GRADLE_PROJECT_gatlingStagingPassword=$token"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check
        run: ./gradlew check spotlessCheck
