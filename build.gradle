plugins {
  id 'java-gradle-plugin'
  id 'com.gradle.plugin-publish' version "2.0.0"
  id("com.diffplug.spotless") version "8.11.0"
}

group = "gradle.plugin.io.gatling.gradle"

java {
  toolchain {
    // the Gradle 9 API jar contains Java 17 class files, which javac 11 can't read
    languageVersion.set(JavaLanguageVersion.of(17))
  }
}

tasks {
  compileJava {
    // still produce Java 11 bytecode for users running Gradle 8 on Java 11
    options.release.set(11)
  }
  test {
    // highest Java version supported by the current Gradle range we support (see GatlingFuncTestBase)
    javaLauncher.set(javaToolchains.launcherFor {
      languageVersion.set(JavaLanguageVersion.of(21))
    })
  }
}

jar {
  manifest {
    attributes 'Implementation-Version': project.version
  }
}

repositories {
  mavenCentral()
  gradlePluginPortal()
  // Gatling's private staging repository on AWS CodeArtifact (set up in CI), holding versions not yet on Maven Central.
  // Credentials come from the gatlingStagingUsername and gatlingStagingPassword Gradle properties.
  def gatlingStagingUrl = providers.gradleProperty("gatlingStagingUrl")
  if (gatlingStagingUrl.present) {
    maven {
      name = "gatlingStaging"
      url = gatlingStagingUrl.get()
      credentials(PasswordCredentials)
    }
  }
}

dependencies {
  implementation "io.gatling:gatling-enterprise-plugin-commons:1.27.0"
  implementation "io.gatling:gatling-shared-cli:0.0.6"

  testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
  testImplementation "org.assertj:assertj-core:3.27.3"
  testImplementation "com.fasterxml.jackson.core:jackson-databind:2.22.2"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.12.2"
  testImplementation "commons-io:commons-io:2.19.0"
}

test {
  testLogging {
    events = ["passed", "skipped", "failed"]
    exceptionFormat = "full"
    showStandardStreams = false
  }
  useJUnitPlatform()
}

gradlePlugin {
  website.set("https://github.com/gatling/gatling-gradle-plugin")
  vcsUrl.set("https://github.com/gatling/gatling-gradle-plugin")
  plugins {
    create("gatlingPlugin") {
      id = "io.gatling.gradle"
      implementationClass = "io.gatling.gradle.GatlingPlugin"
      displayName = "Gatling plugin for Gradle"
      description = "Gatling plugin for Gradle"
      tags.addAll("gatling", "load test", "stress test", "performance test", "java", "scala", "kotlin")
    }
  }
}

spotless {
  java {
    googleJavaFormat()
    licenseHeaderFile("src/etc/header.txt")
  }
  groovyGradle {
    target '*.gradle'
    greclipse().configFile(rootProject.files("src/etc/greclipse.properties"))
  }
}

validatePlugins.failOnWarning = false
